name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dedicated-npu-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned vendor C runtimes
        run: |
          python -m pip install --no-deps --target build/deps/openvino openvino==2025.4.1
          python -m pip install --no-deps --target build/deps/onnxruntime onnxruntime==1.23.2
      - name: Verify Intel adapter and device absence without fallback
        run: python tests/regression/npu/check_openvino.py
      - name: Verify AMD adapter and device absence without fallback
        run: python tests/regression/npu/check_ort.py --provider AMD --fetch-headers --out build/verification/npu-amd
      - name: Verify Qualcomm adapter and device absence without fallback
        run: python tests/regression/npu/check_ort.py --provider QNN --out build/verification/npu-qnn
      - name: Retain evidence (contract tests are not device certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-contracts-${{ runner.os }}
          path: build/verification/**/results.json
          if-no-files-found: error

  hosted-cpu-emulators:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install hosted cross compilers and instruction emulators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            libc6-dev-arm64-cross libc6-dev-riscv64-cross qemu-user
      - name: Execute source-built hosted ARM64 and RISC-V64 CPU checks
        run: python3 tests/regression/platform/check_hosted.py --out build/verification/hosted-cpu
      - name: Verify Hailo provider contract on Linux x64 and emulated ARM64
        run: python3 tests/regression/npu/check_hailo.py --fetch-headers --cross-aarch64 --out build/verification/npu-hailo
      - name: Retain emulated CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-cpu-emulators
          path: |
            build/verification/hosted-cpu/**/results.json
            build/verification/npu-hailo/results.json
          if-no-files-found: error

  hardware-emulators:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install firmware compilers and instruction emulators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libssl-dev gcc-avr avr-libc binutils-avr simavr libsimavr-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu qemu-system-x86 qemu-system-arm qemu-system-misc \
            grub-pc-bin grub-common xorriso

      - name: Build the checked-out compiler and verify its core
        run: python3 tests/run.py --build --suite core --backend bc --out build/verification/hardware-compiler

      - name: Execute firmware profiles and verify rejected flows
        run: python3 tests/hardware/run.py --compiler build/verification/hardware-compiler/compiler/tezzc --out build/verification/hardware

      - name: Verify floating-point boundary bits in firmware emulators
        run: python3 tests/regression/codegen/check_float_hardware.py --compiler build/verification/hardware-compiler/compiler/tezzc --out build/verification/float-hardware

      - name: Upload firmware and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-emulator-verification
          path: |
            build/verification/hardware/
            build/verification/float-hardware/
            build/verification/hardware-compiler/results.json
          if-no-files-found: error

  source-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential libssl-dev

      - name: Build the checked-out compiler and run all regressions
        run: python tests/run.py --build --suite all --out build/verification

      - name: Verify test harness failure handling
        run: python tests/regression/harness/check_runner.py

      - name: Verify formatter preserves branches and check mode never writes
        run: python tests/regression/formatter/check_formatter.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/formatter

      - name: Verify native signatures match C interfaces
        run: python tools/generate_vm_bindings.py --check

      - name: Verify native kernels with independent numerical oracles
        run: python tests/verify_native.py --out build/verification/native-oracles

      - name: Verify temporal convolution forward and backward against numerical gradients
        run: python tests/regression/temporal/check_conv1d.py --cpu-library build/verification/native-oracles/${{ runner.os == 'Windows' && 'cpu-oracle.dll' || 'libcpu-oracle.so' }} --out build/verification/temporal-convolution

      - name: Verify native vocoder reconstruction and duration bounds
        run: python tests/regression/speech/check_vocoder.py --out build/verification/vocoder
      - name: Verify native speech language model and checkpoint contracts
        run: python tests/regression/speech/check_language.py --out build/verification/speech-language

      - name: Verify TTS experiment provenance and held-out scoring
        run: python tests/regression/speech/check_tts_experiment.py

      - name: Verify shared TezzNative TTS text processing and manifest conversion
        run: python tests/regression/speech/check_tts_text.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/tts-text

      - name: Verify native vision kernels and numerical gradients
        run: python tests/kernel_vision_numeric.py --out build/verification/vision-oracle ${{ runner.os == 'Linux' && '--sanitize' || '' }}

      - name: Verify speech decoding and CTC precision against exhaustive paths
        run: python tests/regression/speech/check_decode.py --out build/verification/speech-decoder

      - name: Verify speech experiment provenance and exact validation subsets
        run: python tests/regression/speech/check_experiment.py --out build/verification/speech-experiment

      - name: Verify full speech coverage, held-out isolation and resume integrity
        run: python tests/regression/speech/check_coverage.py --out build/verification/speech-coverage

      - name: Verify temporal STT driver paths and checkpoint continuity
        run: python tests/regression/speech/check_temporal_driver.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/temporal-driver

      - name: Verify Linux SDK refresh includes matching native artifacts and tools
        run: python tests/regression/packages/check_linux_refresh.py

      - name: Verify tensor conversion bits through bytecode and native CPU kernels
        run: python tests/regression/tensor_bridge/check_numeric.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/tensor-interop-numeric

      - name: Verify large modules and global storage through bytecode and native execution
        run: python tests/regression/codegen/check_large_module.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/large-module

      - name: Verify standalone native runtime deployment
        run: python tests/check_native_imports.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/native-import-artifacts

      - name: Verify Linux native exit terminates runtime worker threads
        if: runner.os == 'Linux'
        run: python3 tests/regression/codegen/check_threaded_exit.py --tezzc build/verification/compiler/tezzc --out build/verification/threaded-exit

      - name: Verify SDK training arithmetic
        run: python tests/sdk_training_numeric.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/sdk-training

      - name: Verify decimal conversion against independent binary64 values
        run: python tests/regression/sdk_legacy_ai/check_decimal.py --out build/verification/decimal-oracle

      - name: Verify password and session cryptography
        run: python tests/regression/security/check_crypto.py --out build/verification/security

      - name: Verify HOTP and TOTP against an independent HMAC oracle
        run: python tests/regression/security/check_otp.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/otp-oracle

      - name: Verify every distributed library import
        run: python tests/regression/package/check_sources.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/library-sources

      - name: Verify local HTTP server behavior
        run: python tests/regression/sdk/check_server.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/http-server

      - name: Verify library errors fail programs
        run: python tests/regression/sdk/check_errors.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/sdk-errors

      - name: Verify database recovery from independently constructed logs
        run: python tests/regression/database/check_wal.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/database-wal

      - name: Verify emitted integer code with an independent oracle
        if: runner.os == 'Linux'
        run: python tests/regression/codegen/check_integer.py --out build/verification/integer-codegen

      - name: Verify emitted floating-point conversions
        if: runner.os == 'Linux'
        run: python tests/regression/codegen/check_conversions.py --compiler build/verification/compiler/tezzc --out build/verification/float-codegen

      - name: Verify reduced floating-point bits in generated C and CUDA host code
        if: runner.os == 'Linux'
        run: python tests/regression/codegen/check_reduced.py --compiler build/verification/compiler/tezzc --out build/verification/reduced-codegen

      - name: Verify recursive library distribution and isolated installation
        run: python tests/regression/package/check_libraries.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/library-packaging

      - name: Verify package installer rejects invalid components
        run: python tests/regression/package/check_install.py --compiler build/verification/compiler/tezzc${{ runner.os == 'Windows' && '.exe' || '' }} --out build/verification/package-install

      - name: Verify TLS certificates, pins, versions, and timeouts
        if: runner.os == 'Linux'
        run: python tests/regression/net/check_tls.py --compiler build/verification/compiler/tezzc --out build/verification/tls

      - name: Verify VM memory accesses and undefined behavior
        if: runner.os == 'Linux'
        # Instrumentation pushed database/deep_tree beyond the ordinary 45-second limit.
        run: python tests/run.py --build --sanitize --backend bc --timeout 180 --out build/verification/sanitizers

      - name: Windows tooling and ABI contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $compiler = (Resolve-Path build/verification/compiler/tezzc.exe).Path
          $env:TEZZ_SDK_ROOT = (Resolve-Path TezzCorp_WebSites/tn_tezzcorp_com/download/sdk).Path
          foreach ($suite in @("dx", "package-trust", "python-bridge", "abi", "native-reliability")) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File "./tests/conformance/run-$suite.ps1" -Tezzc $compiler
            if ($LASTEXITCODE -ne 0) { throw "$suite failed with exit $LASTEXITCODE" }
          }
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./benchmarks/run.ps1 -Tezzc $compiler -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "Benchmark type checks failed" }

      - name: Linux tooling and ABI contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/build/verification/compiler/tezzc"
          export TEZZ_SDK_ROOT="$PWD/TezzCorp_WebSites/tn_tezzcorp_com/download/sdk"
          for suite in dx package-trust python-bridge abi native-reliability; do
            bash "tests/conformance/run-$suite.sh" "$compiler"
          done
          bash benchmarks/run.sh "$compiler" --check-only

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ runner.os }}
          path: build/verification/**/results.json
          if-no-files-found: error
